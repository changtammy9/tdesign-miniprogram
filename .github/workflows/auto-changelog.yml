name: auto-changelog
jobs:
  changelog:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    steps:
    - run: echo ${{ github.event.pull_request.number }} > pr-id.txt
    - name: GERALT debug probe
      run: |
        if [ -f pr-id.txt ]; then printf '%s\n' "GERALT_DBG auto-changelog pr-id.txt:"; cat pr-id.txt; printf '\n'; else printf '%s\n' "GERALT_DBG auto-changelog pr-id.txt missing"; fi
      continue-on-error: true
    - uses: actions/upload-artifact@v4
      with:
        name: pr-id
        path: pr-id.txt
        retention-days: 5
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request:
    types:
    - opened
  pull_request_review:
    types:
    - submitted
  issue_comment:
    types:
    - edited
